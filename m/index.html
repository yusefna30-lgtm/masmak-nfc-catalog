<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل ملاك المصمك | EZWA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif;background:#050505;color:white}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
<div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded- p-8 text-center">
<div class="w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center" style="background:#D4AF37;color:black;font-weight:900;font-size:2rem">م</div>
<h1 class="text-2xl font-black mb-2">سجل مُلاك المصمك</h1>
<div class="bg-black rounded-2xl p-6 border border-zinc-800">
<p id="edition" class="text-3xl font-black mb-4" style="color:#D4AF37">041/100</p>
<p id="owner" class="text-xl font-bold mb-2">جاري التحقق...</p>
<p id="path-label" class="text-xs text-zinc-500"></p>
</div>
<div id="claim-section" class="hidden mt-6">
<input id="name-input" placeholder="اكتب اسمك لتوثيقه" class="w-full p-4 rounded-2xl bg-black border text-center">
<button onclick="claim()" class="mt-3 w-full py-4 rounded-2xl font-black text-black" style="background:#D4AF37">توثيق ملكيتي</button>
</div>
</div>
<script>
const params=new URLSearchParams(window.location.search);
let id=params.get('id')||'041';
document.getElementById('edition').innerText=id.padStart(3,'0')+'/100';
let owner=localStorage.getItem('ezwa_owner_'+id);
let path=localStorage.getItem('ezwa_path_'+id);
if(owner){document.getElementById('owner').innerText=owner;document.getElementById('path-label').innerText=path||'';}
else{document.getElementById('owner').innerText='غير موثق';document.getElementById('claim-section').classList.remove('hidden');}
function claim(){let n=document.getElementById('name-input').value.trim();if(n.length<2)return;localStorage.setItem('ezwa_owner_'+id,n);location.reload();}
</script>
</body>
</html>
