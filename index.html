<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لأنك عزوة - سراج المصمك | EZWA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif;background:#0a0a0a;color:white}</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
<div id="choice-screen" class="max-w-2xl w-full">
<h1 class="text-5xl font-black text-center mb-2" style="color:#D4AF37">لأنك عزوة</h1>
<p class="text-center text-zinc-400 mb-8">المصمك ما ينفتح بفلوس. اختر كيف تستحق مفتاحه</p>
<div class="grid gap-4">
<button onclick="selectPath('personal')" class="border border-zinc-800 hover:border-yellow-600 p-5 rounded-2xl text-right transition-all hover:bg-zinc-900">
<h3 class="font-bold text-lg">1. الاقتناء الشخصي - لنفسي</h3>
<p class="text-sm text-zinc-400">أشتريها لأني أنا عزوة نفسي. اسمي سيضيء في المصمك</p>
</button>
<button onclick="selectPath('gift')" class="border border-zinc-800 hover:border-yellow-600 p-5 rounded-2xl text-right transition-all hover:bg-zinc-900">
<h3 class="font-bold text-lg">2. لأنك عزوة - تهديها</h3>
<p class="text-sm text-zinc-400">لا أشتريها لي. أهديها لمن كان عزوتي</p>
</button>
<button onclick="selectPath('action')" class="border border-zinc-800 hover:border-yellow-600 p-5 rounded-2xl text-right transition-all hover:bg-zinc-900">
<h3 class="font-bold text-lg">3. ادفع بفعل، مو بفلوس</h3>
<p class="text-sm text-zinc-400">اليوم الدفع مغلق. ادفع بفعل خير موثق</p>
</button>
<button onclick="selectPath('enemy')" class="border border-zinc-800 hover:border-yellow-600 p-5 rounded-2xl text-right transition-all hover:bg-zinc-900">
<h3 class="font-bold text-lg">4. البس عدوك - صُلح</h3>
<p class="text-sm text-zinc-400">أشتريها لشخص بيني وبينه خلاف. أرده لعزوتي</p>
</button>
</div>
</div>

<div id="masmak-screen" class="hidden max-w-3xl w-full text-center">
<h2 class="text-3xl font-bold mb-6" style="color:#D4AF37">سِراج المصمك</h2>
<p class="text-zinc-400 mb-6">أشعل الأربعة أركان - كلها من قلب المصمك</p>
<div class="relative bg-zinc-900 rounded-3xl p-8 border border-zinc-800">
<svg viewBox="0 0 300 200" class="w-full h-64 mb-6">
<rect x="50" y="40" width="200" height="120" fill="none" stroke="#333" stroke-width="2" id="palace-outer"/>
<rect x="50" y="20" width="20" height="30" fill="none" stroke="#333" stroke-width="2"/>
<rect x="230" y="20" width="20" height="30" fill="none" stroke="#333" stroke-width="2"/>
<rect x="50" y="130" width="20" height="30" fill="none" stroke="#333" stroke-width="2"/>
<rect x="230" y="130" width="20" height="30" fill="none" stroke="#333" stroke-width="2"/>
<rect x="130" y="100" width="40" height="60" fill="none" stroke="#333" stroke-width="2"/>
<rect x="80" y="60" width="20" height="20" fill="#111" stroke="#555" id="win1" class="cursor-pointer" onclick="openPuzzle(1)"/>
<rect x="200" y="60" width="20" height="20" fill="#111" stroke="#555" id="win2" class="cursor-pointer" onclick="openPuzzle(2)"/>
<rect x="80" y="110" width="20" height="20" fill="#111" stroke="#555" id="win3" class="cursor-pointer" onclick="openPuzzle(3)"/>
<rect x="200" y="110" width="20" height="20" fill="#111" stroke="#555" id="win4" class="cursor-pointer" onclick="openPuzzle(4)"/>
</svg>
<div class="grid grid-cols-2 gap-3 text-sm">
<div id="status1" class="p-3 bg-black rounded-xl">ركن السور ⭕ مطفي</div>
<div id="status2" class="p-3 bg-black rounded-xl">ركن البئر ⭕ مطفي</div>
<div id="status3" class="p-3 bg-black rounded-xl">ركن الباب ⭕ مطفي</div>
<div id="status4" class="p-3 bg-black rounded-xl">ركن المجلس ⭕ مطفي</div>
</div>
<button id="final-btn" class="hidden mt-6 w-full py-4 rounded-2xl font-black text-black" style="background:#D4AF37" onclick="finalize()">امسح لتملك - إصدار <span id="edition-num">041</span>/100</button>
</div>
</div>

<div id="puzzle-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50">
<div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-6 max-w-md w-full">
<div id="puzzle-content"></div>
<button onclick="closePuzzle()" class="mt-4 w-full py-2 bg-zinc-800 rounded-xl">إغلاق</button>
</div>
</div>

<script>
let path='', solved=[false,false,false,false], ownerName='';
function selectPath(p){
 path=p;
 if(p==='gift'){ ownerName=prompt('من هو عزوتك؟ اكتب اسمه:'); if(!ownerName) return; }
 else if(p==='enemy'){ ownerName=prompt('من تريد أن تتصالح معه؟'); if(!ownerName) return; }
 else if(p==='action'){ alert('اختر فعل خير: سداد فاتورة / سلة مقاضي'); ownerName=prompt('اكتب اسمك للتوثيق:'); if(!ownerName) return; }
 else { ownerName=prompt('اكتب اسمك الأول:'); if(!ownerName) return; }
 document.getElementById('choice-screen').classList.add('hidden');
 document.getElementById('masmak-screen').classList.remove('hidden');
 document.getElementById('edition-num').innerText=String(Math.floor(Math.random()*100)+1).padStart(3,'0');
}
function openPuzzle(n){
 let c=document.getElementById('puzzle-content');
 if(n===1){ c.innerHTML=`<h3 class='font-bold mb-3'>ركن السور - رتب طبقات المصمك</h3><p class='text-xs text-zinc-400 mb-3'>لبن > طين > جص > حجر</p><input id='ans1' placeholder='لبن,طين,جص,حجر' class='w-full p-3 rounded-xl bg-black border border-zinc-700'><button onclick='check1()' class='mt-3 w-full py-2 rounded-xl bg-yellow-600 text-black font-bold'>تأكيد</button>`; }
 if(n===2){ c.innerHTML=`<h3 class='font-bold mb-3'>أين كان بئر المصمك؟</h3><div class='grid grid-cols-2 gap-2'><button onclick='check2("NE")' class='p-3 bg-black rounded-xl border'>شمالية شرقية</button><button onclick='check2("NW")' class='p-3 bg-black rounded-xl border'>شمالية غربية</button><button onclick='check2("SE")' class='p-3 bg-black rounded-xl border'>جنوبية شرقية</button><button onclick='check2("SW")' class='p-3 bg-black rounded-xl border'>جنوبية غربية</button></div>`; }
 if(n===3){ c.innerHTML=`<h3 class='font-bold mb-3'>أي مفتاح يفتح خوخة باب المصمك؟</h3><div class='flex gap-2'><button onclick='check3(1)' class='flex-1 p-3 bg-black rounded-xl'>🔑 كبير</button><button onclick='check3(2)' class='flex-1 p-3 bg-black rounded-xl border'>🗝️ صغير</button><button onclick='check3(3)' class='flex-1 p-3 bg-black rounded-xl'>🔑 متوسط</button></div>`; }
 if(n===4){ c.innerHTML=`<h3 class='font-bold mb-3'>رتب مجلس المصمك</h3><input id='ans4' placeholder='إمام,قاضي,فارس,ضيف' class='w-full p-3 rounded-xl bg-black border border-zinc-700'><button onclick='check4()' class='mt-3 w-full py-2 rounded-xl bg-yellow-600 text-black font-bold'>تأكيد</button>`; }
 document.getElementById('puzzle-modal').classList.remove('hidden');
}
function closePuzzle(){ document.getElementById('puzzle-modal').classList.add('hidden'); }
function check1(){ let v=document.getElementById('ans1').value; if(v.includes('لبن')&&v.indexOf('لبن')<v.indexOf('طين')){ solve(1); } else alert('الترتيب: لبن,طين,جص,حجر'); }
function check2(d){ if(d==='NE'){ solve(2); } else alert('خطأ - البئر في الشمال الشرقي'); }
function check3(k){ if(k===2){ solve(3); } else alert('الخوخة تحتاج مفتاح صغير'); }
function check4(){ let v=document.getElementById('ans4').value; if(v.includes('إمام')){ solve(4); } else alert('رتب: إمام,قاضي,فارس,ضيف'); }
function solve(n){
 solved[n-1]=true;
 document.getElementById('win'+n).setAttribute('fill','#D4AF37');
 document.getElementById('status'+n).innerHTML=['ركن السور ✅','ركن البئر ✅','ركن الباب ✅','ركن المجلس ✅'][n-1];
 document.getElementById('status'+n).style.color='#D4AF37';
 closePuzzle();
 if(solved.every(s=>s)){ document.getElementById('palace-outer').setAttribute('stroke','#D4AF37'); document.getElementById('final-btn').classList.remove('hidden'); }
}
function finalize(){
 let edition=document.getElementById('edition-num').innerText;
 localStorage.setItem('ezwa_owner_'+edition, ownerName);
 localStorage.setItem('ezwa_path_'+edition, path);
 window.location.href='m/?id='+edition;
}
</script>
</body>
</html>
